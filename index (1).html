    <div class="fgrid">
      ${field('g-tank', 'Tank capacity', inp('g-tank', `inputmode="decimal" value="${g.tankL}"`, 'L'))}
      ${field('g-res', 'Reserve', inp('g-res', `inputmode="decimal" value="${g.reserveL}"`, 'L'))}
    </div>
    ${field('g-kmpl', 'Expected mileage', inp('g-kmpl', `inputmode="decimal" value="${g.estKmpl}"`, 'km/L'), 'Used for range until you have two full-tank refuels. After that the app uses your real average.')}
    ${field('g-odo', 'Odometer now', inp('g-odo', `inputmode="numeric" placeholder="${dv.odoEst ? nf0.format(dv.odoEst) : ''}" value=""`, 'km'), dv.lastRead ? `Last reading: ${nf0.format(dv.odoNow)} km on ${fDate(dv.lastRead.at)}${dv.kmSinceRead >= 0.5 ? `, plus ${kmf(dv.kmSinceRead)} km of rides since (about ${nf0.format(dv.odoEst)} now)` : ''}. Type what the bike shows to correct it.` : 'Type the total km shown as ODO on your bike.')}
    <button class="btn primary" type="submit">Save</button>
    <hr class="divider">
    ${S.installEvt ? `<button type="button" class="btn" data-act="install">${ic('down')}Install Off Road on this phone</button>` : ''}
    <div class="note">${Store.mode === 'cloud' ? 'Your rides, refuels and costs are saved to your Claude account and only you can see them. Export a backup now and then.' : Store.mode === 'local' ? 'Your data is saved in this browser only. Export a backup now and then so you don’t lose it.' : 'Connecting to storage…'}</div>
    <div class="row-btns">
      <button type="button" class="btn" data-act="export-json">${ic('down')}Backup (.json)</button>
      <button type="button" class="btn" data-act="export-csv">${ic('down')}Costs (.csv)</button>
    </div>
    ${field('g-restore', 'Restore from a backup', `<input id="g-restore" type="file" accept=".json,application/json">`)}
    ${S.hideSample && !hasReal() ? `<button type="button" class="btn ghost" data-act="show-sample">Show sample data again</button>` : ''}
  </form>`, root => {
    root.querySelector('#f').onsubmit = async e => {
      e.preventDefault();
      const patch = { bikeName: root.querySelector('#g-name').value.trim() || 'My bike', tankL: num(root.querySelector('#g-tank').value) || 12, reserveL: num(root.querySelector('#g-res').value), estKmpl: num(root.querySelector('#g-kmpl').value) || 40 };
      const o = num(root.querySelector('#g-odo').value); if (o) { patch.odo = o; patch.odoAt = Date.now(); }
      try { await Store.saveGarage(patch); closeSheet(); toast('Saved'); } catch (e) { }
    };
    root.querySelector('#g-restore').onchange = async ev => {
      const f = ev.target.files[0]; if (!f) return;
      try {
        const o = JSON.parse(await f.text());
        if (!o || o.app !== 'ride-log') throw new Error('bad');
        closeSheet(); toast('Restoring backup…');
        if (o.garage) await Store.saveGarage(o.garage);
        if (o.rides && o.rides.length) await Store.saveRides(o.rides);
        for (const x of o.fills || []) await Store.saveItem('fuel', x);
        for (const x of o.exp || []) await Store.saveItem('expenses', x);
        toast('Backup restored');
      } catch (e) { toast("That file isn't a Ride Log backup."); }
    };
  });
}

/* ---------- Ride detail with map ---------- */
let leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'vendor/leaflet.css'; document.head.appendChild(css);
    const sc = document.createElement('script'); sc.src = 'vendor/leaflet.js';
    sc.onload = () => (window.L ? res(window.L) : rej(new Error('no map')));
    sc.onerror = () => { leafletP = null; sc.remove(); rej(new Error('offline')); };
    document.head.appendChild(sc);
  });
  return leafletP;
}
const isDark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
function sheetRideView(r, d) {
  const min = Math.max(0, (r.end - r.start) / 6e4), sp = min > 0 ? r.km / (min / 60) : 0;
  const has = r.path && r.path.length >= 2, gm = has ? Core.gmapsUrl(r.path) : '';
  const note = r.src === 'timeline' ? 'The line joins the points Google Timeline saved, so it can cut across corners.' : r.src === 'gps' ? 'Recorded by GPS on this phone.' : '';
  openSheet(r.title || 'Ride', `<div class="form">
    <div class="ride-map" id="ride-map">${has ? routeSvg(r.path, 600, 320, 'route-lg') : '<div class="empty"><b>No route saved</b>This ride was logged by hand, so there is no map.</div>'}</div>
    ${has && note ? `<p class="map-note">${note}</p>` : ''}
    ${statsHtml([
      ['Distance', kmf(r.km), 'km', r.approx ? 'estimated' : ''],
      ['Time', fDur(min), '', ''],
      ['Average', sp ? nf0.format(sp) : '—', 'km/h', ''],
      [r.maxKmh ? 'Top speed' : 'Recorded by', r.maxKmh ? nf0.format(r.maxKmh) : (SRC[r.src] || 'Manual'), r.maxKmh ? 'km/h' : '', ''],
    ])}
    <div class="calc num">${fDay(r.start)} ${new Date(r.start).getFullYear()} · ${fTime(r.start)} to ${fTime(r.end)}</div>
    <div class="row-btns">${gm ? `<a class="btn" href="${esc(gm)}" target="_blank" rel="noopener">${ic('ride')}Open in Google Maps</a>` : ''}${d.sample ? '' : `<button type="button" class="btn primary" data-edit-ride="${esc(r.id)}">${ic('pen')}Edit ride</button>`}</div>
  </div>`, root => {
    if (!has || IN_CLAUDE) return null;
    let map = null, dead = false;
    loadLeaflet().then(L => {
      const el = root.querySelector('#ride-map');
      if (dead || !el) return;
      el.innerHTML = ''; el.classList.add('live-map');
      const dark = isDark();
      map = L.map(el, { scrollWheelZoom: false, attributionControl: true });
      L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? 'dark_all' : 'rastertiles/voyager'}/{z}/{x}/{y}{r}.png`,
        { subdomains: 'abcd', maxZoom: 19, attribution: '&copy; OpenStreetMap contributors &copy; CARTO' }).addTo(map);
      const line = L.polyline(r.path, { color: dark ? '#FF6A2B' : '#D4470E', weight: 5, opacity: 0.95, lineJoin: 'round', lineCap: 'round' }).addTo(map);
      L.circleMarker(r.path[0], { radius: 7, color: '#FFFFFF', weight: 3, fillColor: '#2B8A3E', fillOpacity: 1 }).bindTooltip('Start').addTo(map);
      L.circleMarker(r.path[r.path.length - 1], { radius: 7, color: '#FFFFFF', weight: 3, fillColor: '#15181C', fillOpacity: 1 }).bindTooltip('Finish').addTo(map);
      map.fitBounds(line.getBounds(), { padding: [28, 28], maxZoom: 17 });
      setTimeout(() => { if (map) map.invalidateSize(); }, 80);
    }).catch(() => { });
    return () => { dead = true; if (map) { map.remove(); map = null; } };
  });
}

/* ---------- Google Timeline import ---------- */
const IMPORT_TYPES_KEY = 'ride-import-types', LAST_IMPORT_KEY = 'ride-last-import';
function sheetImport(pre) {
  const last = +lsGet(LAST_IMPORT_KEY) || 0;
  openSheet('Import Google Timeline', `<div class="form">
    ${last ? `<div class="calc">Last import: <b>${fDate(last)}</b>. Rides you already have are skipped, so importing the whole file again is fine.</div>` : ''}
    <ol class="steps">
      <li>In <b>Google Maps</b>: your profile picture → <b>Settings</b> → <b>Personal content</b> → <b>Export Timeline data</b>. Save the file.</li>
      <li>Choose that file below.${IN_CLAUDE ? '' : ' Or, in your Files app, share <b>Timeline.json</b> to <b>Off Road</b>.'}</li>
      <li>Check the count and tap <b>Import rides</b>.</li>
    </ol>
    ${field('t-file', 'Timeline file', `<input id="t-file" type="file">`, 'Takeout files work too (unzip first, pick one month’s JSON). The file stays on your phone; only the rides you import are saved.')}
    <div id="t-out"></div></div>`, root => {
    const out = root.querySelector('#t-out');
    const handle = async (getText, name) => {
      out.innerHTML = `<div class="calc">Reading ${esc(name)}…</div>`;
      let res;
      try { res = Core.parseTimeline(JSON.parse(await getText())); }
      catch (e) { out.innerHTML = `<div class="calc">${esc(e instanceof SyntaxError ? "That file isn't valid JSON. Choose the Timeline.json file you exported from Google Maps." : e.message)}</div>`; return; }
      if (!res.trips.length) { out.innerHTML = `<div class="calc">No trips found in this file.</div>`; return; }
      const types = Object.entries(res.types).sort((a, b) => b[1] - a[1]);
      const present = new Set(types.map(t => t[0]));
      let saved = null; try { saved = JSON.parse(lsGet(IMPORT_TYPES_KEY) || 'null'); } catch (e) { }
      const checked = new Set(saved && saved.some(t => present.has(t)) ? saved : present.has('MOTORCYCLING') ? ['MOTORCYCLING'] : DEFAULT_TYPES);
      const hasMoto = present.has('MOTORCYCLING');
      out.innerHTML = `<div class="form">
        <div class="calc">Found <b>${nf0.format(res.trips.length)} trips</b> from ${fDate(res.from)} to ${fDate(res.to)}.</div>
        <div class="field"><span class="flabel">Which trips were on your bike?</span>
          <div class="typelist">${types.map(([t, n]) => `<label><input type="checkbox" value="${esc(t)}" ${checked.has(t) ? 'checked' : ''}><span>${esc(TYPE_NAMES[t] || t.toLowerCase().replace(/_/g, ' '))}</span><em>${nf0.format(n)}</em></label>`).join('')}</div>
          <span class="hint">${hasMoto ? 'Only Motorcycling is ticked. If Google labelled some bike trips as Driving, tick that too.' : 'Google often records motorcycle trips as "Driving". Untick anything that wasn’t the bike.'} Your choice is remembered for next time.</span></div>
        <div class="fgrid">
          ${field('t-from', 'From date', inp('t-from', `type="date" value="${toInput(res.from).slice(0, 10)}"`))}
          ${field('t-min', 'Skip trips shorter than', inp('t-min', `inputmode="decimal" value="0.2"`, 'km'))}
        </div>
        <div class="calc" id="t-count"></div>
        <button class="btn primary" id="t-go">Import rides</button></div>`;
      const pick = () => {
        const ty = [...out.querySelectorAll('.typelist input:checked')].map(i => i.value), tys = new Set(ty);
        const from = new Date(out.querySelector('#t-from').value + 'T00:00').getTime() || 0, min = num(out.querySelector('#t-min').value);
        const sel = res.trips.filter(t => tys.has(t.type) && t.start >= from && t.km >= min);
        const fresh = sel.filter(t => !Core.overlaps(t, S.rides));
        return { ty, fresh, dup: sel.length - fresh.length };
      };
      const upd = () => {
        const p = pick();
        out.querySelector('#t-count').innerHTML = p.fresh.length
          ? `Will import <b>${nf0.format(p.fresh.length)} new rides</b> · ${kmf(p.fresh.reduce((s, t) => s + t.km, 0))} km${p.dup ? `. ${nf0.format(p.dup)} already in your log will be skipped.` : '.'}`
          : p.dup ? `All ${nf0.format(p.dup)} matching rides are already in your log. Nothing new to import.` : 'No trips match. Tick a trip type above.';
        out.querySelector('#t-go').disabled = !p.fresh.length;
      };
      out.addEventListener('input', upd); out.addEventListener('change', upd); upd();
      out.querySelector('#t-go').onclick = async () => {
        const p = pick(), btn = out.querySelector('#t-go'); btn.disabled = true; btn.textContent = 'Importing…';
        lsSet(IMPORT_TYPES_KEY, JSON.stringify(p.ty));
        const rides = p.fresh.map(t => ({ id: t.id, start: t.start, end: t.end, km: t.km, approx: !!t.approx, src: 'timeline', path: Core.simplify(t.path, PATH_MAX), title: Core.rideTitle(t.from, t.to), gType: t.type }));
        try { await Store.saveRides(rides); lsSet(LAST_IMPORT_KEY, String(Date.now())); closeSheet(); toast(`Imported ${nf0.format(rides.length)} rides`); location.hash = 'rides'; }
        catch (e) { btn.disabled = false; btn.textContent = 'Import rides'; }
      };
    };
    root.querySelector('#t-file').onchange = ev => { const f = ev.target.files[0]; if (f) handle(() => f.text(), f.name); };
    if (pre) handle(() => Promise.resolve(pre.text), pre.name);
  });
}
async function checkShared() {
  if (IN_CLAUDE || !/[?&]shared=1/.test(location.search) || !('caches' in window)) return;
  try { history.replaceState(null, '', location.pathname + (location.hash || '#rides')); } catch (e) { }
  try {
    const c = await caches.open('off-road-share'), res = await c.match('shared-timeline');
    if (!res) return toast("The shared file didn't arrive. Use Rides → Import Google Timeline instead.");
    const text = await res.text(), name = decodeURIComponent(res.headers.get('x-name') || 'Timeline.json');
    await c.delete('shared-timeline');
    if (location.hash !== '#rides') location.hash = 'rides';
    sheetImport({ text, name });
  } catch (e) { toast("Couldn't open the shared file. Use Rides → Import Google Timeline instead."); }
}

/* ---------- Live GPS ride ---------- */
const T = { on: false };
let wake = null;
function liveOdo() {
  if (!hasReal()) return '';
  const dv = derive(data());
  if (!dv.odoNow) return '';
  return `<p class="msg num">ODO about <b>${nf0.format(Math.floor(dv.odoEst + T.km))}</b> km</p>`;
}
function liveHtml() {
  const min = T.start ? (Date.now() - T.start) / 6e4 : 0, avg = min > 0 ? T.km / (min / 60) : 0;
  const hh = Math.floor(min / 60), mm = String(Math.floor(min % 60)).padStart(2, '0'), ss = String(Math.floor((min * 60) % 60)).padStart(2, '0');
  return `<div class="st"><i class="${T.fix ? 'on' : ''}"></i>${T.err ? 'NO GPS' : T.fix ? 'RECORDING' : 'WAITING FOR GPS'}</div>
  <div class="center">
    <div class="km num">${nf1.format(T.km)}<small>km</small></div>
    ${T.err ? `<p class="msg err">${esc(T.err)}</p>` : `<p class="msg">${T.fix ? 'Keep this screen open while you ride. Your phone may stop GPS if the screen locks.' : 'Getting your location…'}</p>`}
    ${liveOdo()}
    <div class="grid3 num"><div><b>${hh}:${mm}:${ss}</b><span>TIME</span></div><div><b>${nf0.format(T.speed || 0)}</b><span>KM/H NOW</span></div><div><b>${nf0.format(avg)}</b><span>KM/H AVG</span></div></div>
  </div>
  <div class="btns">${T.err ? `<button class="btn" data-live="close">Close</button><button class="btn primary" data-live="manual">Log ride by hand</button>`
    : `<button class="btn" data-live="discard">${T.armed ? 'Tap again to discard' : 'Discard'}</button><button class="btn primary" data-live="stop">Finish & save</button>`}</div>`;
}
function drawLive() { $('#live').innerHTML = liveHtml(); }
function startRide(resume) {
  Object.assign(T, { on: true, start: Date.now(), km: 0, pts: [], last: null, lastT: 0, speed: 0, maxKmh: 0, fix: false, err: '', armed: false });
  if (resume) Object.assign(T, { start: resume.start, km: resume.km || 0, pts: resume.pts || [], maxKmh: resume.maxKmh || 0, last: null });
  clearLive(); saveLive(true);
  $('#live').hidden = false; document.body.style.overflow = 'hidden'; drawLive();
  if (!('geolocation' in navigator)) { T.err = "This browser doesn't offer GPS."; return drawLive(); }
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { wake = l; }).catch(() => { }); } catch (e) { }
  T.tick = setInterval(drawLive, 1000);
  try {
    T.watch = navigator.geolocation.watchPosition(onPos, e => {
      if (e.code === 1) { T.err = IN_CLAUDE ? "Location access is blocked, so this ride can't be tracked here. Pages opened inside Claude can't use GPS. Log the ride by hand, or import it later from Google Timeline."
        : "Location access is blocked. In Chrome, tap the icon left of the address, open Permissions, and allow Location for this site. Then start the ride again."; stopWatch(); }
      else if (!T.fix) T.err = '';
      drawLive();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  } catch (e) { T.err = "GPS isn't available here."; drawLive(); }
}
const LIVE_KEY = 'ride-live-v1';
let liveSavedAt = 0;
function saveLive(force) {
  if (!force && Date.now() - liveSavedAt < 5000) return;
  liveSavedAt = Date.now();
  lsSet(LIVE_KEY, JSON.stringify({ start: T.start, km: T.km, pts: Core.simplify(T.pts, 400), maxKmh: T.maxKmh, at: Date.now() }));
}
function clearLive() { try { localStorage.removeItem(LIVE_KEY); } catch (e) { } }
function pendingLive() { try { const o = JSON.parse(lsGet(LIVE_KEY) || 'null'); return o && o.start ? o : null; } catch (e) { return null; } }
function onPos(p) {
  const c = p.coords; T.err = '';
  if (c.accuracy > 60) { drawLive(); return; }
  const pt = [c.latitude, c.longitude];
  if (T.last) {
    const dk = Core.hav(T.last, pt); if (dk < 0.008) { T.speed = c.speed != null ? c.speed * 3.6 : 0; return; }
    const h = (p.timestamp - T.lastT) / 36e5, v = h > 0 ? dk / h : 0;
    if (v > 180) return;
    T.km += dk; T.speed = c.speed != null ? c.speed * 3.6 : v; T.maxKmh = Math.max(T.maxKmh, T.speed);
  }
  T.fix = true; T.last = pt; T.lastT = p.timestamp; T.pts.push([+pt[0].toFixed(5), +pt[1].toFixed(5)]);
  saveLive();
}
function stopWatch() { if (T.watch != null) navigator.geolocation.clearWatch(T.watch); T.watch = null; clearInterval(T.tick); if (wake) { wake.release().catch(() => { }); wake = null; } }
function closeLive() { stopWatch(); clearLive(); T.on = false; $('#live').hidden = true; document.body.style.overflow = ''; }
async function liveAction(a) {
  if (a === 'close') return closeLive();
  if (a === 'manual') { closeLive(); return sheetRide(); }
  if (a === 'discard') { if (!T.armed) { T.armed = true; return drawLive(); } closeLive(); return toast('Ride discarded'); }
  if (a === 'stop') {
    if (T.km < 0.05) { closeLive(); return toast('Ride too short to save'); }
    const r = { id: 'gps-' + T.start, start: T.start, end: T.lastT || Date.now(), km: Math.round(T.km * 100) / 100, src: 'gps', path: Core.simplify(T.pts, PATH_MAX), maxKmh: Math.round(T.maxKmh), title: '' };
    closeLive();
    try { await Store.saveRides([r]); toast(`Saved ${nf1.format(r.km)} km ride`); } catch (e) { }
  }
}

/* ---------- Export ---------- */
function exportJson() {
  const o = { app: 'ride-log', version: 1, exportedAt: new Date().toISOString(), garage: S.garage, rides: S.rides, fills: S.fills, exp: S.exp };
  Store.download(`ride-log-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(o));
}
function exportCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Type', 'Category', 'Amount (BDT)', 'Litres', 'Odometer (km)', 'Note']];
  S.fills.forEach(x => rows.push([toInput(x.at).replace('T', ' '), 'Fuel', x.full ? 'Full tank' : 'Top-up', Math.round(x.total), x.liters, x.odo, x.station || '']));
  S.exp.forEach(x => rows.push([toInput(x.at).slice(0, 10), 'Cost', x.cat, Math.round(x.amount), '', x.odo || '', x.note || '']));
  rows.sort((a, b) => (a[0] > b[0] ? 1 : -1));
  Store.download(`ride-log-costs-${new Date().toISOString().slice(0, 10)}.csv`, rows.map(r => r.map(q).join(',')).join('\n'));
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-view-ride],[data-edit-ride],[data-edit-fill],[data-edit-exp],[data-filter],[data-rep],[data-rep-step],[data-live]');
  if (!t) return;
  const d = data();
  if (t.dataset.live) return liveAction(t.dataset.live);
  if (t.dataset.viewRide) { const r = d.rides.find(x => x.id === t.dataset.viewRide); return r && sheetRideView(r, d); }
  if (t.dataset.editRide) { const r = d.rides.find(x => x.id === t.dataset.editRide); return r && sheetRide(r); }
  if (t.dataset.editFill) { const r = d.fills.find(x => x.id === t.dataset.editFill); return r && sheetFuel(r); }
  if (t.dataset.editExp) { const r = d.exp.find(x => x.id === t.dataset.editExp); return r && sheetExp(r); }
  if (t.dataset.filter) { S.costFilter = t.dataset.filter; return render(); }
  if (t.dataset.rep) { S.rep.kind = t.dataset.rep; return render(); }
  if (t.dataset.repStep) {
    const s = +t.dataset.repStep;
    if (S.rep.kind === 'year') S.rep.y += s; else { const m = S.rep.m + s; S.rep.y += Math.floor(m / 12); S.rep.m = (m + 12) % 12; }
    return render();
  }
  switch (t.dataset.act) {
    case 'start-ride': return startRide();
    case 'add-fuel': return sheetFuel();
    case 'add-exp': return sheetExp();
    case 'add-ride': return sheetRide();
    case 'import': return sheetImport();
    case 'settings': return sheetSettings();
    case 'close-sheet': return closeSheet();
    case 'more-rides': S.rideMonthsShown += 6; return render();
    case 'hide-sample': S.hideSample = true; lsSet('ride-hide-sample', '1'); return render();
    case 'show-sample': S.hideSample = false; lsSet('ride-hide-sample', '0'); closeSheet(); return render();
    case 'export-json': return exportJson();
    case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; closeSheet(); } return;
    case 'live-resume': { const p = pendingLive(); return p && startRide(p); }
    case 'live-drop': clearLive(); toast('Ride discarded'); return render();
    case 'live-save': {
      const p = pendingLive(); if (!p) return render();
      clearLive();
      return Store.saveRides([{ id: 'gps-' + p.start, start: p.start, end: p.at || Date.now(), km: Math.round(p.km * 100) / 100, src: 'gps', path: Core.simplify(p.pts || [], PATH_MAX), maxKmh: Math.round(p.maxKmh || 0), title: '' }])
        .then(() => { toast(`Saved ${nf1.format(p.km)} km ride`); render(); }, () => { });
    }
    case 'export-csv': return exportCsv();
  }
});
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
window.addEventListener('hashchange', route);
let lastW = window.innerWidth, rzT;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (Math.abs(window.innerWidth - lastW) > 20) { lastW = window.innerWidth; if (S.view === 'fuel' || S.view === 'reports') render(); } }, 200); });

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Off Road is installed'); });
if (!IN_CLAUDE) {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
}
S.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
render();
Store.init().then(checkShared);

</script>
